<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIGH LEVEL | MEMBER LIST</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,500;0,700;0,900;1,900&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

  <style>
    /* =========================================
       🎨 THEME SETTINGS
       ========================================= */
    :root {
        /* 🎀 ธีม 1: Pink (ค่าเริ่มต้น) */
        --main-color: #ff1493;       
        --highlight-color: #ff69b4;  
        --font: 'Kanit', sans-serif;
        --card-bg: rgba(20, 20, 20, 0.85);
    }

    /* 🌈 ธีม 2: Pastel (แก้ไขใหม่ให้ตรงหน้าแรก) */
    body.theme-pastel {
        /* ✅ แก้เป็นสีทอง (Gold) ให้เหมือนปุ่มหน้าแรก */
        --main-color: #ffd700;       
        --highlight-color: #fffacd;  /* สีครีมสว่าง */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* =========================================
       🖼️ BACKGROUND LAYER
       ========================================= */
    #bg-fixed {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: -1;
        
        /* รูปพื้นหลังหลัก */
        background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('../highlevel.png');
        background-size: cover;
        background-position: center;
        
        transition: filter 0.8s ease-in-out;
        filter: hue-rotate(0deg);
    }

    /* ✅ แก้ไข: หมุนสีไป 240 องศา จะได้สีน้ำเงิน/ม่วง (Blue/Indigo) เหมือนหน้าแรก */
    body.theme-pastel #bg-fixed {
        filter: hue-rotate(240deg) brightness(1.3) saturate(1.1);
    }

    body {
        font-family: var(--font);
        color: white;
        background-color: #000;
        min-height: 100vh;
        overflow-y: auto;
    }

    /* =========================================
       🔘 HEADER & NAVIGATION
       ========================================= */
    .back-nav { position: fixed; top: 20px; left: 20px; z-index: 100; }

    .back-btn {
        background: rgba(0,0,0,0.6);
        color: var(--main-color);
        border: 1px solid var(--main-color);
        padding: 10px 25px;
        border-radius: 30px;
        font-family: var(--font);
        font-weight: 700;
        cursor: pointer;
        transition: all 0.5s ease;
        backdrop-filter: blur(5px);
    }

    .back-btn:hover {
        background: var(--main-color);
        color: white; /* หรือ color: #000 ถ้าอยากให้ตัวหนังสือดำตอนชี้สีทอง */
        box-shadow: 0 0 15px var(--main-color);
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 60px 20px;
        text-align: center;
    }

    /* ✅ LOGO */
    .main-header-logo {
        max-width: 350px; 
        width: 90%;
        height: auto;
        display: block;
        margin: 0 auto 30px;
        transition: filter 0.5s ease;
        filter: drop-shadow(0 0 20px var(--main-color)); 
        animation: floatLogo 3s ease-in-out infinite;
        cursor: pointer;
    }
    .main-header-logo:active { transform: scale(0.95); }

    @keyframes floatLogo {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
    }

    /* =========================================
       🔍 SEARCH BAR
       ========================================= */
    .search-container { position: relative; max-width: 500px; margin: 0 auto 60px; }
    .search-container i {
        position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
        color: var(--highlight-color); font-size: 1.5rem; transition: color 0.5s ease;
    }
    .search-box {
        width: 100%; padding: 15px 15px 15px 50px; border-radius: 50px;
        border: 2px solid var(--main-color);
        background: rgba(0, 0, 0, 0.6);
        color: white; font-family: var(--font); font-size: 1.1rem;
        outline: none; transition: all 0.5s ease; opacity: 0.8;
    }
    .search-box:focus { opacity: 1; box-shadow: 0 0 15px var(--main-color); }

    /* =========================================
       👥 MEMBER LIST STYLES
       ========================================= */
    section { margin-bottom: 60px; }
    h2 {
        font-size: 2.5rem; font-weight: 900; font-style: italic;
        color: white; margin-bottom: 30px; text-transform: uppercase;
        display: inline-block; padding: 10px 40px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        border-radius: 50px;
        text-shadow: 0 0 10px var(--main-color); letter-spacing: 2px;
        border-bottom: 3px solid var(--main-color);
        transition: all 0.5s ease;
    }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; justify-content: center; }
    .card {
        background: var(--card-bg);
        border: 1px solid var(--main-color);
        border-radius: 15px; padding: 25px; text-align: center;
        transition: border-color 0.5s ease, transform 0.3s;
        backdrop-filter: blur(10px);
        position: relative; overflow: hidden;
    }
    .card:hover { transform: translateY(-10px); box-shadow: 0 0 25px var(--main-color), inset 0 0 15px var(--main-color); }
    .profile {
        width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
        border: 3px solid var(--main-color); margin-bottom: 15px;
        box-shadow: 0 0 15px var(--main-color); transition: all 0.5s ease;
    }
    .card h3 { font-size: 1.3rem; margin-bottom: 10px; color: white; text-transform: uppercase; }
    .fb-link {
        display: inline-block; padding: 8px 20px; margin-top: 10px;
        background: linear-gradient(90deg, var(--main-color), var(--highlight-color));
        color: white; text-decoration: none; border-radius: 20px;
        font-size: 0.9rem; font-weight: bold; transition: all 0.5s ease;
    }
    .fb-link:hover { box-shadow: 0 0 15px var(--main-color); transform: scale(1.05); }

    /* =========================================
       📄 PAGINATION & FOOTER
       ========================================= */
    .pagination-container { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
    .page-btn {
        background: transparent; border: 2px solid var(--main-color); color: white;
        width: 40px; height: 40px; border-radius: 50%;
        font-family: var(--font); font-weight: bold; cursor: pointer; transition: all 0.5s ease;
    }
    .page-btn.active, .page-btn:hover { background: var(--main-color); box-shadow: 0 0 10px var(--main-color); }
    footer { margin-top: 50px; font-size: 0.8rem; color: rgba(255,255,255,0.5); }
    @media (max-width: 600px) {
        .main-header-logo { max-width: 280px; }
        h2 { font-size: 1.8rem; padding: 10px 20px; }
        .list { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
  </style>
</head>
<body>

  <audio id="list-music" loop>
    <source src="../bg.mp3" type="audio/mpeg">
  </audio>

  <div id="bg-fixed"></div>

  <nav class="back-nav">
    <button class="back-btn" onclick="window.location.href='../index.html'">
      <i class='bx bx-left-arrow-alt'></i> HOME
    </button>
  </nav>

  <div class="container">
    <img src="ganglist_logo.png" alt="GANG LIST" class="main-header-logo" id="theme-logo">

    <div class="search-container">
      <i class='bx bx-search'></i>
      <input type="text" id="searchInput" class="search-box" placeholder="ค้นหารายชื่อสมาชิก...">
    </div>

    <section id="founderSection">
      <h2>FOUNDER</h2>
      <div class="list" id="founderlist"></div>
    </section>

    <section id="leaderSection">
      <h2>LEADER</h2>
      <div class="list" id="leaderlist"></div>
    </section>

    <section id="memberSection">
      <h2>MEMBER</h2>
      <div class="list" id="memberlist"></div>
      <div id="pagination-controls" class="pagination-container"></div>
    </section>

    <footer> HIGH LEVEL GANG © DESIGNED BY KEN </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        
        const logoImg = document.getElementById('theme-logo');
        const body = document.body;

        // ✅ 1. โหลดธีมที่บันทึกไว้
        const currentTheme = localStorage.getItem('siteTheme'); 

        if (currentTheme === 'pastel') {
            body.classList.add('theme-pastel');
            if(logoImg) logoImg.src = 'ganglist_logo_2.png'; 
        } else {
            body.classList.remove('theme-pastel');
            if(logoImg) logoImg.src = 'ganglist_logo.png'; 
        }

        // ✅ 2. กดเปลี่ยนธีมในหน้านี้
        if (logoImg) {
            logoImg.addEventListener('click', function() {
                body.classList.toggle('theme-pastel');

                if (body.classList.contains('theme-pastel')) {
                    logoImg.src = 'ganglist_logo_2.png'; 
                    localStorage.setItem('siteTheme', 'pastel'); 
                } else {
                    logoImg.src = 'ganglist_logo.png'; 
                    localStorage.setItem('siteTheme', 'default'); 
                }
            });
        }

        // --- ส่วนโหลดข้อมูล (เหมือนเดิม) ---
        const defaultImage = "https://i.pinimg.com/originals/91/ab/f0/91abf0d74be5d9aeb1346178e70dde96.gif";
        let allData = []; let allMembers = []; 
        const itemsPerPage = 8; let currentPage = 1;

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.onkeydown = function(e) { if(e.keyCode==123) return false; };

        function createCard(person) {
            const imgSrc = person.image && person.image.trim() !== "" ? person.image : defaultImage;
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `<img src="${imgSrc}" class="profile"><h3>${person.name}</h3><a href="${person.facebook}" target="_blank" class="fb-link">FACEBOOK</a>`;
            return card;
        }

        function displayMembers(membersArray) {
            const memberList = document.getElementById("memberlist");
            const founderSection = document.getElementById("founderSection");
            const leaderSection = document.getElementById("leaderSection");
            memberList.innerHTML = "";
            if (currentPage === 1) {
                founderSection.style.display = "block";
                leaderSection.style.display = "block";
            } else {
                founderSection.style.display = "none";
                leaderSection.style.display = "none";
            }
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = membersArray.slice(start, end);
            paginatedItems.forEach(p => memberList.appendChild(createCard(p)));
            renderPagination(membersArray.length);
        }

        function renderPagination(totalItems) {
            const container = document.getElementById("pagination-controls");
            container.innerHTML = "";
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) return;
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement("button");
                btn.innerText = i;
                btn.className = (i === currentPage) ? "page-btn active" : "page-btn";
                btn.onclick = () => { currentPage = i; displayMembers(allMembers); window.scrollTo({ top: 300, behavior: 'smooth' }); };
                container.appendChild(btn);
            }
        }

        const searchInput = document.getElementById("searchInput");
        searchInput.addEventListener("input", e => {
            const val = e.target.value.toLowerCase().trim();
            const fList = document.getElementById("founderlist");
            const lList = document.getElementById("leaderlist");
            const mList = document.getElementById("memberlist");
            const fSec = document.getElementById("founderSection");
            const lSec = document.getElementById("leaderSection");
            const mSec = document.getElementById("memberSection");
            const pageControl = document.getElementById("pagination-controls");

            if (val === "") {
                currentPage = 1; fList.innerHTML = ""; lList.innerHTML = "";
                const founders = allData.filter(p => p.permission === "founder");
                const leaders = allData.filter(p => p.permission === "leader");
                founders.forEach(p => fList.appendChild(createCard(p)));
                leaders.forEach(p => lList.appendChild(createCard(p)));
                displayMembers(allMembers);
                fSec.style.display = founders.length > 0 ? "block" : "none";
                lSec.style.display = "block"; mSec.style.display = "block";
                pageControl.style.display = "flex";
            } else {
                pageControl.style.display = "none"; fList.innerHTML = ""; lList.innerHTML = ""; mList.innerHTML = "";
                const filtered = allData.filter(p => p.name.toLowerCase().includes(val));
                filtered.forEach(p => {
                    const card = createCard(p);
                    if (p.permission === "founder") fList.appendChild(card);
                    else if (p.permission === "leader") lList.appendChild(card);
                    else mList.appendChild(card);
                });
                fSec.style.display = fList.children.length > 0 ? "block" : "none";
                lSec.style.display = lList.children.length > 0 ? "block" : "none";
                mSec.style.display = mList.children.length > 0 ? "block" : "none";
                if (filtered.length === 0) {
                    mSec.style.display = "block"; mList.innerHTML = `<p style="opacity:0.5; width:100%; margin-top:20px;">ไม่พบรายชื่อที่ค้นหา...</p>`;
                }
            }
        });

        fetch("../person.json")
            .then(res => res.json())
            .then(data => {
                allData = data;
                const fList = document.getElementById("founderlist");
                const lList = document.getElementById("leaderlist");
                const founders = data.filter(p => p.permission === "founder");
                const leaders = data.filter(p => p.permission === "leader");
                allMembers = data.filter(p => p.permission === "member"); 
                founders.forEach(p => fList.appendChild(createCard(p)));
                leaders.forEach(p => lList.appendChild(createCard(p)));
                displayMembers(allMembers);
            })
            .catch(err => console.error("Error loading JSON:", err));
    });
  </script>
</body>
</html>
